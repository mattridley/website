name: Platform upgrade

on:
  push:
    branches:
      - upgrade/next-react-node
    paths:
      - .github/workflows/platform-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/next-react-node
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upgrade Next, React and TypeScript
        run: |
          npm install --ignore-scripts next@latest react@latest react-dom@latest
          npm install --ignore-scripts --save-dev typescript@latest @types/react@latest @types/react-dom@latest @types/node@latest
      - name: Remove obsolete Next serverless target
        run: |
          cat > next.config.js <<'EOF'
          module.exports = {};
          EOF
      - name: Verify production build
        run: npm run build
      - name: Verify TypeScript
        run: npm run type-check
      - name: Commit upgrade and remove helper workflow
        run: |
          rm .github/workflows/platform-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json next.config.js tsconfig.json next-env.d.ts .github/workflows/platform-upgrade.yml
          git commit -m "Upgrade Next.js, React and Node toolchain"
          git push origin HEAD:upgrade/next-react-node
