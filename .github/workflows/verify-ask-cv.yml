name: Verify Ask CV stack

on:
  push:
    branches:
      - feature/ask-cv-stacked
    paths:
      - .github/workflows/verify-ask-cv.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ask-cv-stacked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Place CV assistant under homepage headline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/index.tsx')
          text = path.read_text()
          if 'import CvQuestion from "../components/cv-question";' not in text:
              text = text.replace(
                  'import Header from "../components/header";\n',
                  'import Header from "../components/header";\nimport CvQuestion from "../components/cv-question";\n',
              )

          marker = '''                  </h1>\n                  <p className="mt-6 max-w-3xl text-lg leading-8 text-gray-700">'''
          if '<CvQuestion />' not in text:
              text = text.replace(
                  marker,
                  '''                  </h1>\n                  <CvQuestion />\n                  <p className="mt-6 max-w-3xl text-lg leading-8 text-gray-700">''',
                  1,
              )
          path.write_text(text)
          PY
      - name: Install feature dependencies and refresh lockfile
        run: npm install --ignore-scripts --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run type-check
      - name: Commit verified feature and remove helper workflow
        run: |
          rm .github/workflows/verify-ask-cv.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/pages/index.tsx .github/workflows/verify-ask-cv.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Place CV assistant on homepage and refresh lockfile"
            git push origin HEAD:feature/ask-cv-stacked
          fi
